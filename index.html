<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Børsspil</title>
<meta name="description" content="Fiktivt børsspil med simulerede kurser. Kun til underholdning og læring." />
<meta name="theme-color" content="#0B0E11" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  html, body { margin: 0; padding: 0; background: #0B0E11; }
  * { box-sizing: border-box; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (max-width: 720px) {
    .boersspil-grid { grid-template-columns: 1fr !important; }
    .boersspil-grid > div:last-child { margin-top: 4px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const START_CASH = 100000;
const TICK_MS = 2500;
const HISTORY_LEN = 40;
const MAX_CATCHUP_TICKS = 200;
const SAVE_KEY = "boersspil_save_v1";
const LEADERBOARD_KEY = "boersspil_leaderboard_v1"; // lokalt på denne enhed/browser

// OBS: Kurser er simulerede, ikke rigtige realtidskurser.
const SEED_STOCKS = [
  { id: "NOVO-B", name: "Novo Nordisk", price: 680, vol: 0.018, category: "Stabil" },
  { id: "MAERSK-B", name: "A.P. Møller - Mærsk", price: 12500, vol: 0.02, category: "Cyklisk" },
  { id: "ORSTED", name: "Ørsted", price: 385, vol: 0.025, category: "Vækst" },
  { id: "VWS", name: "Vestas Wind Systems", price: 145, vol: 0.03, category: "Vækst" },
  { id: "CARL-B", name: "Carlsberg", price: 900, vol: 0.012, category: "Stabil" },
  { id: "DSV", name: "DSV", price: 1180, vol: 0.02, category: "Cyklisk" },
  { id: "NZYM-B", name: "Novozymes", price: 460, vol: 0.015, category: "Stabil" },
  { id: "GMAB", name: "Genmab", price: 2050, vol: 0.028, category: "Vækst" },
  { id: "COLO-B", name: "Coloplast", price: 850, vol: 0.014, category: "Stabil" },
  { id: "DANSKE", name: "Danske Bank", price: 205, vol: 0.02, category: "Cyklisk" },
  { id: "PNDORA", name: "Pandora", price: 1350, vol: 0.03, category: "Cyklisk" },
  { id: "AMBU-B", name: "Ambu", price: 105, vol: 0.032, category: "Vækst" },
];

const NEWS_UP = [
  "overrasker markedet med stærkere regnskab end ventet",
  "får opgraderet anbefaling af flere analytikere",
  "vinder stor ny kontrakt",
  "løfter forventningerne til resten af året",
  "nyder godt af stigende efterspørgsel",
];
const NEWS_DOWN = [
  "skuffer med regnskab under forventning",
  "nedjusteres af flere analytikere",
  "taber en stor kunde",
  "advarer om lavere indtjening end ventet",
  "rammes af stigende omkostninger",
];

const CATEGORY_COLORS = {
  Stabil: { bg: "rgba(74,144,217,0.15)", fg: "#6FA8E8" },
  Vækst: { bg: "rgba(176,132,240,0.15)", fg: "#B084F0" },
  Cyklisk: { bg: "rgba(232,163,61,0.15)", fg: "#E8A33D" },
};

function tickPrice(price, vol) {
  const bigMove = Math.random() < 0.06;
  const magnitude = bigMove ? vol * (6 + Math.random() * 10) : vol;
  const drift = (Math.random() - 0.48) * magnitude;
  const next = Math.max(0.5, price * (1 + drift));
  return { price: Math.round(next * 100) / 100, bigMove };
}

function formatKr(n) {
  return n.toLocaleString("da-DK", { maximumFractionDigits: 2 }) + " kr";
}
function formatTime(ts) {
  return new Date(ts).toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
}

// Simpel selvskrevet sparkline (ingen ekstern grafbibliotek nødvendig)
function Sparkline({ data, color, height = 32 }) {
  if (!data || data.length < 2) return <div style={{ height }} />;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const w = 100;
  const points = data
    .map((v, i) => {
      const x = (i / (data.length - 1)) * w;
      const y = height - ((v - min) / range) * height;
      return `${x},${y}`;
    })
    .join(" ");
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none">
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" />
    </svg>
  );
}

function Icon({ children, size = 14 }) {
  return <span style={{ fontSize: size, lineHeight: 1, display: "inline-flex" }}>{children}</span>;
}

function Boersspil() {
  const [playerName, setPlayerName] = useState("");
  const [nameInput, setNameInput] = useState("");
  const [cash, setCash] = useState(START_CASH);
  const [holdings, setHoldings] = useState({});
  const [trades, setTrades] = useState([]);
  const [news, setNews] = useState([]);
  const [stocks, setStocks] = useState(
    SEED_STOCKS.map((s) => ({ ...s, prev: s.price, history: [s.price] }))
  );
  const [selected, setSelected] = useState(null);
  const [qtyInput, setQtyInput] = useState(1);
  const [leaderboard, setLeaderboard] = useState([]);
  const [loadedStorage, setLoadedStorage] = useState(false);
  const [toast, setToast] = useState(null);
  const [resetConfirm, setResetConfirm] = useState(false);
  const tickRef = useRef(null);
  const resetTimerRef = useRef(null);
  const stateRef = useRef({});

  stateRef.current = { cash, holdings, trades, stocks, playerName };

  const showToast = useCallback((message, type = "info") => {
    setToast({ message, type });
    setTimeout(() => setToast((t) => (t && t.message === message ? null : t)), 3000);
  }, []);

  // Kurssimulering
  useEffect(() => {
    tickRef.current = setInterval(() => {
      setStocks((prev) => {
        const newsItems = [];
        const updated = prev.map((s) => {
          const { price: next, bigMove } = tickPrice(s.price, s.vol);
          if (bigMove) {
            const up = next > s.price;
            const pool = up ? NEWS_UP : NEWS_DOWN;
            const headline = pool[Math.floor(Math.random() * pool.length)];
            newsItems.push({
              id: `${s.id}-${Date.now()}-${Math.random()}`,
              stockName: s.name,
              headline,
              up,
              time: Date.now(),
            });
          }
          const hist = [...s.history, next].slice(-HISTORY_LEN);
          return { ...s, prev: s.price, price: next, history: hist };
        });
        if (newsItems.length) setNews((n) => [...newsItems, ...n].slice(0, 8));
        return updated;
      });
    }, TICK_MS);
    return () => clearInterval(tickRef.current);
  }, []);

  // Indlæs gemt spil fra localStorage + "indhent" kurser for tid der er gået
  useEffect(() => {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        setPlayerName(data.playerName || "");
        setCash(data.cash ?? START_CASH);
        setHoldings(data.holdings || {});
        setTrades(data.trades || []);
        if (data.stockPrices && data.lastTick) {
          const elapsed = Date.now() - data.lastTick;
          const ticks = Math.min(Math.floor(elapsed / TICK_MS), MAX_CATCHUP_TICKS);
          setStocks((prev) =>
            prev.map((s) => {
              let price = data.stockPrices[s.id] ?? s.price;
              for (let i = 0; i < ticks; i++) price = tickPrice(price, s.vol).price;
              return { ...s, prev: price, price, history: [price] };
            })
          );
        }
      }
    } catch (e) {}
    setLoadedStorage(true);
  }, []);

  const saveNow = useCallback((overrides = {}) => {
    const base = stateRef.current;
    const cashVal = overrides.cash ?? base.cash;
    const holdingsVal = overrides.holdings ?? base.holdings;
    const tradesVal = overrides.trades ?? base.trades;
    try {
      const priceMap = {};
      base.stocks.forEach((s) => (priceMap[s.id] = s.price));
      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({
          playerName: base.playerName,
          cash: cashVal,
          holdings: holdingsVal,
          trades: tradesVal,
          stockPrices: priceMap,
          lastTick: Date.now(),
        })
      );
    } catch (e) {
      showToast("Kunne ikke gemme dit spil lige nu", "error");
    }
  }, [showToast]);

  useEffect(() => {
    if (!loadedStorage || !playerName) return;
    const t = setInterval(() => saveNow(), 8000);
    return () => clearInterval(t);
  }, [loadedStorage, playerName, saveNow]);

  const portfolioValue = stocks.reduce((sum, s) => {
    const h = holdings[s.id];
    return sum + (h ? h.qty * s.price : 0);
  }, 0);
  const totalValue = cash + portfolioValue;
  const pl = totalValue - START_CASH;
  const plPct = (pl / START_CASH) * 100;

  // Leaderboard er LOKALT på denne enhed/browser (ingen delt server i denne version)
  const updateLeaderboard = useCallback(() => {
    if (!playerName) return;
    try {
      const raw = localStorage.getItem(LEADERBOARD_KEY);
      const entries = raw ? JSON.parse(raw) : {};
      entries[playerName] = { name: playerName, value: totalValue };
      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(entries));
      const sorted = Object.values(entries).sort((a, b) => b.value - a.value);
      setLeaderboard(sorted.slice(0, 6));
    } catch (e) {
      showToast("Kunne ikke opdatere leaderboard lige nu", "error");
    }
  }, [playerName, totalValue, showToast]);

  useEffect(() => {
    if (!playerName) return;
    updateLeaderboard();
    const t = setInterval(updateLeaderboard, 5000);
    return () => clearInterval(t);
  }, [playerName, updateLeaderboard]);

  const buy = (stock, qty) => {
    const cost = stock.price * qty;
    if (cost > cash || qty <= 0) return;
    const newCash = cash - cost;
    const existing = holdings[stock.id];
    const newQty = (existing?.qty || 0) + qty;
    const newAvg = existing ? (existing.avgCost * existing.qty + cost) / newQty : stock.price;
    const newHoldings = { ...holdings, [stock.id]: { qty: newQty, avgCost: newAvg } };
    const trade = { id: `${Date.now()}-${Math.random()}`, type: "køb", stockId: stock.id, stockName: stock.name, qty, price: stock.price, total: cost, time: Date.now() };
    const newTrades = [trade, ...trades].slice(0, 20);
    setCash(newCash);
    setHoldings(newHoldings);
    setTrades(newTrades);
    showToast(`Købte ${qty} stk ${stock.name} for ${formatKr(cost)}`, "buy");
    saveNow({ cash: newCash, holdings: newHoldings, trades: newTrades });
  };

  const sell = (stock, qty) => {
    const h = holdings[stock.id];
    if (!h || qty <= 0 || qty > h.qty) return;
    const proceeds = stock.price * qty;
    const newCash = cash + proceeds;
    const remaining = h.qty - qty;
    const newHoldings = { ...holdings };
    if (remaining <= 0) delete newHoldings[stock.id];
    else newHoldings[stock.id] = { ...h, qty: remaining };
    const trade = { id: `${Date.now()}-${Math.random()}`, type: "sælg", stockId: stock.id, stockName: stock.name, qty, price: stock.price, total: proceeds, time: Date.now() };
    const newTrades = [trade, ...trades].slice(0, 20);
    setCash(newCash);
    setHoldings(newHoldings);
    setTrades(newTrades);
    showToast(`Solgte ${qty} stk ${stock.name} for ${formatKr(proceeds)}`, "sell");
    saveNow({ cash: newCash, holdings: newHoldings, trades: newTrades });
  };

  const requestReset = () => {
    if (!resetConfirm) {
      setResetConfirm(true);
      resetTimerRef.current = setTimeout(() => setResetConfirm(false), 4000);
      return;
    }
    clearTimeout(resetTimerRef.current);
    setResetConfirm(false);
    setCash(START_CASH);
    setHoldings({});
    setTrades([]);
    showToast("Spillet er nulstillet — du starter forfra", "info");
    saveNow({ cash: START_CASH, holdings: {}, trades: [] });
  };

  if (!playerName) {
    return (
      <div style={styles.page}>
        <div style={styles.loginCard}>
          <div style={styles.logoRow}>
            <div style={styles.logoDot} />
            <span style={styles.logoText}>BØRSSPIL</span>
          </div>
          <p style={styles.loginSub}>Fiktive penge. Simulerede kurser. Ægte lærdom.</p>
          <div style={styles.disclaimerBox}>
            Simulerede kurser — ikke ægte realtidsdata · Fiktive spillepenge — ingen rigtige penge
            involveret · Ikke tilknyttet de nævnte virksomheder · Kun til underholdning og læring
          </div>
          <input
            style={styles.input}
            placeholder="Dit spillernavn"
            value={nameInput}
            onChange={(e) => setNameInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && nameInput.trim() && setPlayerName(nameInput.trim())}
          />
          <button style={styles.startBtn} disabled={!nameInput.trim()} onClick={() => setPlayerName(nameInput.trim())}>
            Start med {formatKr(START_CASH)}
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <div style={styles.tickerWrap}>
        <div style={styles.tickerTrack}>
          {[...stocks, ...stocks].map((s, i) => {
            const up = s.price >= s.prev;
            return (
              <span key={i} style={styles.tickerItem}>
                <span style={styles.tickerSym}>{s.id}</span>
                <span style={{ color: up ? "#00D97E" : "#FF4757" }}>{s.price.toFixed(2)} {up ? "▲" : "▼"}</span>
              </span>
            );
          })}
        </div>
      </div>

      <div style={styles.disclaimerBanner}>
        ⚠ Simulerede kurser — ikke ægte realtidsdata · Fiktive spillepenge — ingen rigtige penge
        involveret · Ikke tilknyttet de nævnte virksomheder · Kun til underholdning og læring
      </div>

      <div style={styles.container}>
        <div style={styles.topBar}>
          <div>
            <div style={styles.eyebrow}>SPILLER</div>
            <div style={styles.playerName}>{playerName}</div>
          </div>
          <div style={styles.balances}>
            <div style={styles.balanceBox}>
              <div style={styles.balanceLabel}><Icon>💰</Icon> Kontant</div>
              <div style={styles.balanceValue}>{formatKr(cash)}</div>
            </div>
            <div style={styles.balanceBox}>
              <div style={styles.balanceLabel}>Total værdi</div>
              <div style={styles.balanceValue}>{formatKr(totalValue)}</div>
            </div>
            <div style={styles.balanceBox}>
              <div style={styles.balanceLabel}>Afkast</div>
              <div style={{ ...styles.balanceValue, color: pl >= 0 ? "#00D97E" : "#FF4757" }}>
                {pl >= 0 ? "+" : ""}{plPct.toFixed(1)}%
              </div>
            </div>
            <button style={styles.resetBtn} onClick={requestReset}>
              <Icon>↺</Icon> {resetConfirm ? "Sikker? Tryk igen" : "Nulstil spil"}
            </button>
          </div>
        </div>

        <div className="boersspil-grid" style={styles.grid}>
          <div style={styles.stockList}>
            {stocks.map((s) => {
              const up = s.price >= s.prev;
              const held = holdings[s.id];
              const cat = CATEGORY_COLORS[s.category];
              return (
                <div key={s.id} style={styles.stockRow} onClick={() => { setSelected(s); setQtyInput(1); }}>
                  <div style={styles.stockLeft}>
                    <div style={styles.stockTopRow}>
                      <span style={styles.stockSym}>{s.id}</span>
                      <span style={{ ...styles.categoryBadge, background: cat.bg, color: cat.fg }}>{s.category}</span>
                    </div>
                    <div style={styles.stockName}>{s.name}</div>
                    {held && <div style={styles.heldBadge}>{held.qty} stk</div>}
                  </div>
                  <div style={styles.sparkWrap}>
                    <Sparkline data={s.history} color={up ? "#00D97E" : "#FF4757"} />
                  </div>
                  <div style={styles.stockRight}>
                    <div style={styles.stockPrice}>{s.price.toFixed(2)}</div>
                    <div style={{ ...styles.stockChange, color: up ? "#00D97E" : "#FF4757" }}>
                      {up ? "▲" : "▼"} {(((s.price - s.prev) / s.prev) * 100).toFixed(2)}%
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={styles.sidebarCol}>
            <div style={styles.sidebar}>
              <div style={styles.panelTitle}><Icon>🏆</Icon> LEADERBOARD</div>
              <div style={styles.leaderboard}>
                {leaderboard.length === 0 && <div style={styles.leaderboardEmpty}>Spil lidt, så dukker du op her.</div>}
                {leaderboard.map((p, i) => (
                  <div key={p.name} style={{ ...styles.leaderRow, background: p.name === playerName ? "rgba(0,217,126,0.1)" : "transparent" }}>
                    <span style={styles.leaderRank}>{i + 1}</span>
                    <span style={styles.leaderName}>{p.name}</span>
                    <span style={styles.leaderValue}>{formatKr(p.value)}</span>
                  </div>
                ))}
              </div>
              <div style={{ fontSize: 11, color: "#5A6472", marginTop: 8, lineHeight: 1.5 }}>
                Leaderboard er lokalt på denne enhed/browser i denne version — ikke delt med andre.
              </div>
            </div>

            <div style={styles.sidebar}>
              <div style={{ ...styles.panelTitle, color: "#7FB3E8" }}><Icon>📰</Icon> NYHEDER</div>
              <div style={styles.newsList}>
                {news.length === 0 && <div style={styles.leaderboardEmpty}>Ingen store nyheder endnu.</div>}
                {news.map((n) => (
                  <div key={n.id} style={styles.newsItem}>
                    <span style={{ color: n.up ? "#00D97E" : "#FF4757", fontWeight: 700 }}>{n.stockName}</span> {n.headline}
                    <div style={styles.newsTime}>{formatTime(n.time)}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        <div style={styles.tradesPanel}>
          <div style={{ ...styles.panelTitle, color: "#8A939F" }}><Icon>🕘</Icon> DINE HANDLER</div>
          {trades.length === 0 ? (
            <div style={styles.leaderboardEmpty}>Ingen handler endnu — køb din første aktie ovenfor.</div>
          ) : (
            <div style={styles.tradesList}>
              {trades.map((t) => (
                <div key={t.id} style={styles.tradeRow}>
                  <span style={{ ...styles.tradeType, color: t.type === "køb" ? "#00D97E" : "#FF4757", background: t.type === "køb" ? "rgba(0,217,126,0.12)" : "rgba(255,71,87,0.12)" }}>{t.type}</span>
                  <span style={styles.tradeStock}>{t.qty} stk {t.stockName}</span>
                  <span style={styles.tradeTotal}>{formatKr(t.total)}</span>
                  <span style={styles.tradeTime}>{formatTime(t.time)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {selected && (
        <div style={styles.modalOverlay} onClick={() => setSelected(null)}>
          <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <div>
                <div style={styles.modalSym}>{selected.id}</div>
                <div style={styles.modalName}>{selected.name}</div>
              </div>
              <button style={styles.closeBtn} onClick={() => setSelected(null)}>✕</button>
            </div>
            <div style={styles.modalPrice}>{selected.price.toFixed(2)} kr / aktie</div>
            <Sparkline data={selected.history} color="#00D97E" height={80} />
            {holdings[selected.id] && (
              <div style={styles.holdingInfo}>Du ejer {holdings[selected.id].qty} stk, snitkøb {holdings[selected.id].avgCost.toFixed(2)} kr</div>
            )}
            <div style={styles.qtyRow}>
              <button style={styles.qtyBtn} onClick={() => setQtyInput((q) => Math.max(1, q - 1))}>−</button>
              <input style={styles.qtyInput} type="number" value={qtyInput} onChange={(e) => setQtyInput(Math.max(1, parseInt(e.target.value) || 1))} />
              <button style={styles.qtyBtn} onClick={() => setQtyInput((q) => q + 1)}>+</button>
            </div>
            <div style={styles.costPreview}>Total: {formatKr(selected.price * qtyInput)}</div>
            <div style={styles.maxRow}>
              <button style={styles.maxBtn} disabled={Math.floor(cash / selected.price) < 1} onClick={() => setQtyInput(Math.max(1, Math.floor(cash / selected.price)))}>
                Maks køb ({Math.floor(cash / selected.price)} stk)
              </button>
              <button style={styles.maxBtn} disabled={!holdings[selected.id]} onClick={() => setQtyInput(holdings[selected.id]?.qty || 1)}>
                Maks sælg ({holdings[selected.id]?.qty || 0} stk)
              </button>
            </div>
            <div style={styles.actionRow}>
              <button style={{ ...styles.actionBtn, background: "#00D97E" }} disabled={selected.price * qtyInput > cash} onClick={() => { buy(selected, qtyInput); setSelected(null); }}>Køb</button>
              <button style={{ ...styles.actionBtn, background: "#FF4757" }} disabled={!holdings[selected.id] || qtyInput > (holdings[selected.id]?.qty || 0)} onClick={() => { sell(selected, qtyInput); setSelected(null); }}>Sælg</button>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div style={{ ...styles.toast, borderColor: toast.type === "error" ? "#FF4757" : toast.type === "sell" ? "#FF4757" : "#00D97E" }}>
          <span>{toast.type === "error" ? "⚠" : "✓"}</span>
          <span>{toast.message}</span>
        </div>
      )}
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "#0B0E11", fontFamily: "system-ui, sans-serif", color: "#E4E7EB" },
  loginCard: { maxWidth: 380, margin: "80px auto", background: "#12161B", border: "1px solid #22282F", borderRadius: 12, padding: "32px 28px", display: "flex", flexDirection: "column", gap: 14 },
  logoRow: { display: "flex", alignItems: "center", gap: 8 },
  logoDot: { width: 10, height: 10, borderRadius: "50%", background: "#00D97E", boxShadow: "0 0 8px #00D97E" },
  logoText: { fontFamily: "'IBM Plex Mono', monospace", letterSpacing: 3, fontSize: 15, fontWeight: 700 },
  loginSub: { fontSize: 13, color: "#8A939F", margin: 0 },
