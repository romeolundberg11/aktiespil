function calcFee(amount) {

function getBuyPrice(price) {

function getSellPrice(price) {

function calcMaxBuyQty(execPrice, cash) {
  if (execPrice <= 0) return 0;
  const flatQty = Math.floor((cash - FEE_MIN) / execPrice);
  if (flatQty * execPrice <= FEE_MIN / FEE_RATE) {
    return Math.max(0, flatQty);
  }
  return Math.max(0, Math.floor(cash / (execPrice * (1 + FEE_RATE))));
}

// Størrelsen af et "stort kurshop" - retningsafhængig: stigninger er mindst 5%, fald mindst 3,5%.
// Stadig størst chance for det laveste interval, derefter aftagende chance for større spring.
function pickMoveMagnitude(up) {
  const floor = up ? 0.05 : 0.035;
  const r = Math.random();
  if (r < 0.75) return floor + Math.random() * (0.09 - floor); // laveste interval, klart mest almindeligt
  if (r < 0.90) return 0.10 + Math.random() * 0.05; // ~10-15%
  if (r < 0.98) return 0.18 + Math.random() * 0.10; // ~18-28%, sjældent
  return 0.30 + Math.random() * 0.15; // ~30-45%, meget sjældent
}

// Bruges kun til at "indhente" kurser når man har været væk (ingen rygte-mekanik nødvendig der)
function tickPrice(price, vol) {
  const bigMove = Math.random() < 0.06;
  let drift;
  if (bigMove) {
    const up = Math.random() < 0.5;
    const magnitude = pickMoveMagnitude(up);
    drift = up ? magnitude : -magnitude;
  } else {
    drift = (Math.random() - 0.48) * vol;
  }
  const next = Math.max(0.5, price * (1 + drift));
  return {
    price: Math.round(next * 100) / 100,
    bigMove
  };
}

// Lille, almindelig kursbevægelse med et strejf af momentum:
// en aktie der lige er steget har en anelse større chance for at fortsætte op, og omvendt.
function tickSmall(price, vol, trend) {
  const momentumShift = trend > 0 ? 0.04 : trend < 0 ? -0.04 : 0;
  const threshold = 0.48 - momentumShift;
  const drift = (Math.random() - threshold) * vol;
  const next = Math.max(0.5, price * (1 + drift));
  return Math.round(next * 100) / 100;
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function pickQuestion(difficulty, usedSet) {
  let pool = QUIZ_QUESTIONS.filter(q => q.difficulty === difficulty && !usedSet.has(q.q));
  if (pool.length === 0) pool = QUIZ_QUESTIONS.filter(q => !usedSet.has(q.q));
  if (pool.length === 0) return null;
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  const withFlag = chosen.options.map((opt, i) => ({
    opt,
    isCorrect: i === chosen.correct
  }));
  const shuffled = shuffleArray(withFlag);
  return {
    q: chosen.q,
    options: shuffled.map(o => o.opt),
    correct: shuffled.findIndex(o => o.isCorrect),
    difficulty: chosen.difficulty,
    sourceText: chosen.q
  };
}

<script>
(function () {
  var DISMISS_KEY = "boersspil_install_banner_dismissed";
  var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (isStandalone) return;
  if (localStorage.getItem(DISMISS_KEY)) return;

  var banner = document.getElementById("install-banner");
  var text = document.getElementById("install-banner-text");
  var actionBtn = document.getElementById("install-banner-action");
  var closeBtn = document.getElementById("install-banner-close");

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var deferredPrompt = null;

  function showBanner() {
    banner.style.display = "block";
  }

  closeBtn.addEventListener("click", function () {
    banner.style.display = "none";
    localStorage.setItem(DISMISS_KEY, "1");
  });

  if (isIOS) {
    text.textContent = "Føj denne app til din hjemmeskærm: tryk Del-ikonet nederst, og vælg \"Føj til hjemmeskærm\".";
    showBanner();
  } else {
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      text.textContent = "Installer Børsspil som en app på din enhed.";
      actionBtn.style.display = "block";
      showBanner();
    });
    actionBtn.addEventListener("click", function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        banner.style.display = "none";
      });
    });
  }
})();
</script>
